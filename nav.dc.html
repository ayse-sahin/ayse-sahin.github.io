<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background:var(--bg);border-bottom:1px solid var(--line);font-family:'Source Sans 3',system-ui,sans-serif">
  <div style="max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,40px);height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="index.html" style="font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink);text-decoration:none;letter-spacing:-.01em">Ayşe Şahin</a>
    <div style="display:flex;align-items:center;gap:6px">
      <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
        <nav aria-label="Main" style="display:flex;align-items:center;gap:2px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
            <a href="{{ it.href }}" aria-current="{{ it.aria }}" style="font-size:16px;font-weight:600;color:{{ it.color }};text-decoration:none;padding:8px 14px;border-radius:6px" style-hover="background:var(--bg-2)">{{ it.label }}</a>
          </sc-for>
        </nav>
      </sc-if>
      <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;margin-left:6px">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"></path></svg>
      </button>
      <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuOpen }}" style="width:40px;height:40px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--band);cursor:pointer">
          <span style="display:block;width:18px;height:2px;border-radius:2px;background:var(--accent-2)"></span>
          <span style="display:block;width:18px;height:2px;border-radius:2px;background:var(--accent-2)"></span>
          <span style="display:block;width:18px;height:2px;border-radius:2px;background:var(--accent-2)"></span>
        </button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Main" style="display:flex;flex-direction:column;padding:6px clamp(20px,5vw,40px) 14px;border-top:1px solid var(--line)">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" aria-current="{{ it.aria }}" style="font-size:18px;font-weight:600;color:{{ it.color }};text-decoration:none;padding:13px 0;border-bottom:1px solid var(--line)">{{ it.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;64px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;research&quot;,&quot;beyond&quot;,&quot;cv&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobile: false, open: false, dark: false };
  componentDidMount() {
    this.mq = matchMedia('(max-width: 760px)');
    this.onMq = () => this.setState({ mobile: this.mq.matches, open: false });
    this.mq.addEventListener('change', this.onMq);
    document.documentElement.style.removeProperty('--serif');
    try { localStorage.removeItem('as-serif'); } catch (e) {}
    const t = document.documentElement.dataset.theme;
    this.setState({ mobile: this.mq.matches, dark: t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches });
  }
  componentWillUnmount() { this.mq && this.mq.removeEventListener('change', this.onMq); }
  renderVals() {
    const cur = this.props.current ?? 'home';
    const items = [
      { id: 'home', label: 'Home', href: 'index.html' },
      { id: 'research', label: 'Research', href: 'research.html' },
      { id: 'beyond', label: 'Beyond', href: 'beyond.html' },
      { id: 'cv', label: 'CV', href: 'cv.html' }
    ].map(i => ({ ...i, aria: i.id === cur ? 'page' : undefined, color: i.id === cur ? 'var(--accent-2)' : 'var(--ink-2)' }));
    return {
      items,
      desktop: !this.state.mobile,
      mobile: this.state.mobile,
      menuOpen: this.state.mobile && this.state.open,
      themeLabel: this.state.dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      toggleTheme: () => {
        const dark = !this.state.dark;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        try { localStorage.setItem('as-theme', dark ? 'dark' : 'light'); } catch (e) {}
        this.setState({ dark });
      }
    };
  }
}
</script>
</body>
</html>
